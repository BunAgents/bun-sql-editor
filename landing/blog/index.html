<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Bun SQL Editor</title>
  <meta name="description" content="Articles about Bun SQL Editor, local-first development, and database tooling." />
  <meta property="og:title" content="Blog — Bun SQL Editor" />
  <meta property="og:description" content="Articles about Bun SQL Editor, local-first development, and database tooling." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://bun-sql-editor.pages.dev/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://bun-sql-editor.pages.dev/blog/index.html" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">
      <img src="../logo.svg" width="28" height="28" alt="" aria-hidden="true" style="display:block;flex-shrink:0" />
      Bun SQL Editor
    </a>

    <nav class="nav-links">
      <a href="../wiki/index.html">Docs</a>
      <a href="index.html" class="active">Blog</a>
      <a href="https://github.com/BunAgents/bun-sql-editor/releases">Releases</a>
    </nav>
    <div class="nav-right">
      <a href="https://github.com/BunAgents/bun-sql-editor" class="btn btn-ghost btn-sm">GitHub</a>
    </div>
  </div>
</header>

<main style="padding: 4rem 0">
  <div class="container-sm">
    <div class="section-tag">Blog</div>
    <h1 class="section-title">Articles</h1>
    <p class="section-sub" style="margin-bottom:3rem">Thoughts on local-first tooling, database development, and the story behind Bun SQL Editor.</p>

    <div id="blogGrid" class="blog-grid">
      <p style="color:var(--muted-fg)">Loading…</p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span>© 2025 Bun SQL Editor · MIT License</span>
    <div class="footer-links">
      <a href="../index.html">Home</a>
      <a href="../wiki/index.html">Docs</a>
      <a href="https://github.com/BunAgents/bun-sql-editor">GitHub</a>
    </div>
  </div>
</footer>

<script type="module">
import { injectSEO } from "../seo.js";

injectSEO({
  title: "Blog",
  description: "Articles about Bun SQL Editor, local-first development, database tooling, and open-source engineering.",
  canonical: "/blog/index.html",
  type: "website",
  breadcrumbs: [
    { name: "Home", path: "/" },
    { name: "Blog", path: "/blog/index.html" },
  ],
});

const CATEGORY_COLORS = { blue:"badge-blue", green:"badge-green", yellow:"badge-yellow", red:"badge-red" };

async function loadBlog() {
  const grid = document.getElementById("blogGrid");
  let posts;
  try {
    const res = await fetch("posts.json");
    posts = await res.json();
  } catch {
    grid.textContent = "Failed to load posts.";
    return;
  }

  // Clear loading placeholder via DOM
  while (grid.firstChild) grid.removeChild(grid.firstChild);

  posts.forEach(post => {
    const date = new Date(post.date).toLocaleDateString("en-US", { year:"numeric", month:"long" });
    const article = document.createElement("article");
    article.className = "blog-item";

    const meta = document.createElement("div");
    meta.className = "blog-item-meta";

    const badge = document.createElement("span");
    badge.className = `badge ${CATEGORY_COLORS[post.categoryColor] || "badge-default"}`;
    badge.textContent = post.category;
    meta.appendChild(badge);

    const dateSpan = document.createElement("span");
    dateSpan.textContent = date;
    meta.appendChild(dateSpan);

    const readSpan = document.createElement("span");
    readSpan.textContent = `${post.readTime} min read`;
    meta.appendChild(readSpan);

    const h2 = document.createElement("h2");
    const link = document.createElement("a");
    link.href = `post.html?slug=${encodeURIComponent(post.slug)}`;
    link.textContent = post.title;
    h2.appendChild(link);

    const desc = document.createElement("p");
    desc.textContent = post.description;

    article.appendChild(meta);
    article.appendChild(h2);
    article.appendChild(desc);
    grid.appendChild(article);
  });
}

loadBlog();
</script>
</body>
</html>
