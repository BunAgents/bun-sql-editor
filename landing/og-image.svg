<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1e1e1e"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2d2d30" stroke-width="1"/>
    </pattern>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#45c8f5"/><stop offset="100%" stop-color="#0080cc"/></linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d4a72"/><stop offset="100%" stop-color="#08304e"/></linearGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe55a"/><stop offset="100%" stop-color="#f5a020"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#007acc" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#007acc" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon (scaled up, centered-left) -->
  <g transform="translate(160, 215) scale(6.67)">
    <rect x="5" y="11" width="20" height="13" rx="1" fill="url(#gBody)"/>
    <ellipse cx="15" cy="24" rx="10" ry="3" fill="#082e48"/>
    <ellipse cx="15" cy="11" rx="10" ry="3" fill="url(#gTop)"/>
    <path d="M17.5 3 L13 13.5 h3.5 L12 27 L21 12 h-3.5 Z" fill="url(#gBolt)" opacity="0.96"/>
  </g>

  <!-- Title -->
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle">Bun SQL Editor</text>

  <!-- Subtitle -->
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#858585" text-anchor="middle">Local SQL workbench · No cloud · No signup</text>

  <!-- Tags -->
  <g transform="translate(380, 390)">
    <rect width="160" height="40" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
    <text x="80" y="26" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#45c8f5" text-anchor="middle">PostgreSQL</text>
  </g>
  <g transform="translate(560, 390)">
    <rect width="120" height="40" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
    <text x="60" y="26" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#45c8f5" text-anchor="middle">MySQL</text>
  </g>
  <g transform="translate(700, 390)">
    <rect width="140" height="40" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
    <text x="70" y="26" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#45c8f5" text-anchor="middle">MongoDB</text>
  </g>
  <g transform="translate(860, 390)">
    <rect width="160" height="40" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
    <text x="80" y="26" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#45c8f5" text-anchor="middle">ClickHouse</text>
  </g>

  <!-- URL -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#464647" text-anchor="middle">bun-sql-editor.pages.dev</text>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="0" fill="none" stroke="#2d2d30" stroke-width="2"/>
</svg>
