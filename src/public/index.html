<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="themeColorMeta" content="#1e1e1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bun SQL" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Bun SQL</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>

    <div class="app" id="app">

      <!-- ══ SIDEBAR ══════════════════════════════════════════ -->
      <aside class="sidebar" id="sidebar" aria-label="Database explorer">

        <!-- Logo + collapse -->
        <div class="sidebar-brand">
          <div class="brand-mark">
            <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="sTop" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#45c8f5"/>
                  <stop offset="100%" stop-color="#0080cc"/>
                </linearGradient>
                <linearGradient id="sBody" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0d4a72"/>
                  <stop offset="100%" stop-color="#08304e"/>
                </linearGradient>
                <linearGradient id="sBolt" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffe55a"/>
                  <stop offset="100%" stop-color="#f5a020"/>
                </linearGradient>
              </defs>
              <!-- Cylinder body -->
              <rect x="5" y="11" width="20" height="13" rx="1" fill="url(#sBody)"/>
              <!-- Bottom ellipse -->
              <ellipse cx="15" cy="24" rx="10" ry="3" fill="#082e48"/>
              <ellipse cx="15" cy="24" rx="10" ry="3" fill="none" stroke="#1a6fa0" stroke-width="0.8" opacity="0.5"/>
              <!-- Mid stripe -->
              <ellipse cx="15" cy="17.5" rx="10" ry="3" fill="none" stroke="#1e7ab5" stroke-width="0.7" opacity="0.4"/>
              <!-- Top cap -->
              <ellipse cx="15" cy="11" rx="10" ry="3" fill="url(#sTop)"/>
              <!-- Sheen -->
              <ellipse cx="11.5" cy="10.2" rx="3.5" ry="1.1" fill="white" opacity="0.15" transform="rotate(-8,11.5,10.2)"/>
              <!-- Bolt -->
              <path d="M17.5 3 L13 13.5 h3.5 L12 27 L21 12 h-3.5 Z" fill="url(#sBolt)" opacity="0.96"/>
            </svg>
          </div>
          <span class="brand-name">
            <span class="brand-bun">BUN</span><span class="brand-suffix">SQL</span>
          </span>
          <button class="icon-btn ml-auto" id="sidebarCollapse" aria-label="Collapse sidebar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
        </div>

        <!-- Connections section -->
        <div class="sidebar-section" id="connSection">
          <div class="section-hd">
            <span class="section-label">Connections</span>
            <div class="section-actions">
              <button class="icon-btn" id="newConnBtn" aria-label="New connection" title="New connection (Ctrl+Shift+N)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="conn-list" id="connList" role="listbox" aria-label="Saved connections"></div>
        </div>

        <!-- Schema explorer section -->
        <div class="sidebar-section sidebar-section--grow" id="explorerSection">
          <div class="section-hd">
            <span class="section-label">Explorer</span>
            <div class="section-actions">
              <button class="icon-btn" id="newSchemaBtn" aria-label="New schema" title="New schema">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M3 6c0-1.1 3.58-2 8-2s8 .9 8 2v2c0 1.1-3.58 2-8 2s-8-.9-8-2V6z"/><path d="M3 12c0 1.1 3.58 2 8 2"/><path d="M3 18c0 1.1 3.58 2 8 2"/><path d="M3 6v12"/><path d="M19 6v6"/><line x1="17" y1="17" x2="23" y2="17"/><line x1="20" y1="14" x2="20" y2="20"/>
                </svg>
              </button>
              <button class="icon-btn" id="newTableBtn" aria-label="New table" title="New table">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="16" y1="6" x2="19" y2="6"/><line x1="17.5" y1="4.5" x2="17.5" y2="7.5"/>
                </svg>
              </button>
              <button class="icon-btn" id="reloadSchema" aria-label="Reload schema" title="Reload schema (F5)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                  <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="explorer-search">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="schemaSearch" type="search" placeholder="Filter objects…" aria-label="Filter schema objects" autocomplete="off" />
          </div>
          <div class="schema-tree" id="schemaTree" role="tree" aria-label="Database schema"></div>
        </div>

        <!-- Sidebar footer -->
        <div class="sidebar-footer">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
            <svg class="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button class="icon-btn" id="installBtn" aria-label="Install app" title="Install Bun SQL" style="display:none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- ══ MAIN ════════════════════════════════════════════ -->
      <div class="main" id="main">

        <!-- Tab bar -->
        <div class="tabbar" id="tabbar" role="tablist" aria-label="Query tabs">
          <div class="tabs-track" id="tabsTrack"></div>
          <div class="tabbar-end">
            <button class="icon-btn" id="addTabBtn" aria-label="New tab" title="New tab (Ctrl+T)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <button class="icon-btn sidebar-show-btn" id="sidebarShowBtn" aria-label="Show sidebar" style="display:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Query toolbar -->
        <div class="query-toolbar" id="queryToolbar">
          <div class="toolbar-conn-pill" id="toolbarConnPill">
            <span class="conn-pill-dot" id="connPillDot"></span>
            <span class="conn-pill-name" id="connPillName">No connection</span>
            <button class="conn-pill-change" id="connPillChange" aria-label="Change connection">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
          </div>
          <div class="toolbar-sep"></div>
          <span class="toolbar-db-label" id="toolbarDbLabel"></span>
          <div class="toolbar-spacer"></div>
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="formatBtn" title="Format SQL (Ctrl+Shift+F)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/>
                <line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/>
              </svg>
              Format
            </button>
            <button class="btn btn-ghost" id="historyBtn" title="Query history">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4"/>
                <polyline points="3 16 3 11 8 11"/>
              </svg>
              History
            </button>
            <button class="btn btn-ghost" id="explainBtn" title="Explain query">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              Explain
            </button>
            <button class="btn btn-run" id="runBtn" aria-label="Run query" title="Run query (Ctrl+Enter)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
              Run
            </button>
          </div>
        </div>

        <!-- Autocomplete dropdown -->
        <div class="ac-dropdown" id="acDropdown" hidden role="listbox" aria-label="Autocomplete suggestions"></div>

        <!-- Table editor panel (shown instead of workspace for table-editor tabs) -->
        <div class="tbl-editor-panel" id="tableEditorPanel" hidden></div>

        <!-- ERD panel (shown instead of workspace for erd tabs) -->
        <div class="erd-panel" id="erdPanel" hidden></div>

        <!-- Editor + Results workspace -->
        <div class="workspace" id="workspace">

          <!-- Code editor panel -->
          <div class="editor-panel" id="editorPanel">
            <div class="gutter" id="gutter"></div>
            <div class="editor-inner" id="editorInner">
              <div class="hl-layer" id="hlLayer" aria-hidden="true"></div>
              <textarea
                id="editor"
                class="editor-ta"
                spellcheck="false"
                autocorrect="off"
                autocapitalize="off"
                autocomplete="off"
                aria-label="SQL query editor"
                aria-multiline="true"
                placeholder="-- Write SQL here&#10;-- Ctrl+Enter to run  •  Tab to indent"
              ></textarea>
            </div>
          </div>

          <!-- Drag divider -->
          <div class="divider" id="divider" role="separator" aria-orientation="horizontal" aria-label="Resize panels" tabindex="0"></div>

          <!-- Results panel -->
          <div class="results-panel" id="resultsPanel">
            <div class="results-bar">
              <div class="results-bar-left">
                <span class="results-label">Results</span>
                <span class="results-count" id="resultsCount" hidden></span>
                <span class="results-time" id="resultsTime" hidden></span>
              </div>
              <div class="results-bar-right">
                <button class="btn btn-ghost btn-sm" id="copyJsonBtn" hidden>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  JSON
                </button>
                <button class="btn btn-ghost btn-sm" id="exportCsvBtn" hidden>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  CSV
                </button>
              </div>
            </div>
            <div class="results-body" id="resultsBody">
              <div class="results-empty" id="resultsEmpty">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.25" aria-hidden="true">
                  <ellipse cx="12" cy="6" rx="9" ry="3.5"/>
                  <path d="M3 6v5c0 1.93 4.03 3.5 9 3.5s9-1.57 9-3.5V6"/>
                  <path d="M3 11v5c0 1.93 4.03 3.5 9 3.5s9-1.57 9-3.5v-5"/>
                </svg>
                <p>Run a query to see results</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Status bar -->
        <div class="statusbar" id="statusbar" aria-live="polite" aria-atomic="true">
          <div class="statusbar-left">
            <span class="status-indicator" id="statusIndicator" data-state="idle"></span>
            <span class="status-text" id="statusText">Ready</span>
          </div>
          <div class="statusbar-right">
            <span class="status-kbd">Ctrl+Enter run</span>
            <span class="status-kbd">Ctrl+T new tab</span>
            <span class="status-kbd">F5 refresh schema</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ CONNECTION MODAL ════════════════════════════════════ -->
    <div class="modal-backdrop" id="connModal" role="dialog" aria-modal="true" aria-labelledby="connModalTitle" hidden>
      <div class="modal">
        <div class="modal-hd">
          <h2 id="connModalTitle" class="modal-title">Connection</h2>
          <button class="icon-btn" id="connModalClose" aria-label="Close">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <!-- Saved connections list -->
          <div class="modal-sidebar">
            <div class="modal-sidebar-hd">Saved</div>
            <div class="modal-saved-list" id="modalSavedList"></div>
          </div>
          <!-- Connection form -->
          <div class="modal-form-area">
            <div class="form-field">
              <label for="mConnName">Name</label>
              <input id="mConnName" type="text" placeholder="Production PG" autocomplete="off" />
            </div>
            <div class="form-row-2">
              <div class="form-field">
                <label for="mDbType">Type</label>
                <select id="mDbType">
                  <option value="postgres">PostgreSQL</option>
                  <option value="mysql">MySQL / MariaDB</option>
                  <option value="mongodb">MongoDB</option>
                  <option value="clickhouse">ClickHouse</option>
                </select>
              </div>
              <div class="form-field" id="mPortField">
                <label for="mPort">Port</label>
                <input id="mPort" type="text" placeholder="5432" />
              </div>
            </div>
            <div class="form-field" id="mHostField">
              <label for="mHost" id="mHostLabel">Host</label>
              <input id="mHost" type="text" placeholder="localhost" autocomplete="off" />
            </div>
            <div class="form-row-2" id="mCredFields">
              <div class="form-field">
                <label for="mUser">User</label>
                <input id="mUser" type="text" placeholder="postgres" autocomplete="username" />
              </div>
              <div class="form-field">
                <label for="mPass">Password</label>
                <input id="mPass" type="password" placeholder="••••••" autocomplete="current-password" />
              </div>
            </div>
            <div class="form-field">
              <label for="mDatabase">Database</label>
              <input id="mDatabase" type="text" placeholder="database name" autocomplete="off" />
            </div>
            <div class="form-check">
              <input id="mSsl" type="checkbox" />
              <label for="mSsl">Use SSL / TLS</label>
            </div>
            <div class="conn-test-result" id="connTestResult" hidden>
              <span class="test-result-icon" id="connTestIcon"></span>
              <span class="test-result-msg" id="connTestMsg"></span>
              <span class="test-result-time" id="connTestTime"></span>
            </div>
          </div>
        </div>
        <div class="modal-ft">
          <button class="btn btn-test" id="connTestBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
            Test Connection
          </button>
          <div class="modal-ft-right">
            <button class="btn btn-danger" id="connDeleteBtn" hidden>Delete</button>
            <button class="btn btn-primary" id="connSaveBtn">Save &amp; Connect</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Context menu -->
    <div class="ctx-menu" id="ctxMenu" hidden>
      <button class="ctx-item" id="ctxNewTable">New Table here</button>
      <button class="ctx-item" id="ctxOpenErd">Open ERD diagram</button>
      <button class="ctx-item" id="ctxDropSchema">Drop Schema…</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" id="ctxEditTable">Edit Table…</button>
      <button class="ctx-item" id="ctxDropTable">Drop Table…</button>
      <button class="ctx-item" id="ctxTruncate">Truncate Table…</button>
      <div class="ctx-sep" id="ctxMaintSep"></div>
      <button class="ctx-item" id="ctxVacuum">Vacuum Analyze</button>
      <button class="ctx-item" id="ctxReindex">Reindex Table</button>
    </div>

    <!-- DDL Modal -->
    <div class="modal-backdrop" id="ddlModal" role="dialog" aria-modal="true" hidden>
      <div class="modal modal--sm">
        <div class="modal-hd">
          <h2 class="modal-title" id="ddlModalTitle">Create</h2>
          <button class="icon-btn" id="ddlModalClose" aria-label="Close">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-form-area" id="ddlFormArea"></div>
        <div class="modal-ft">
          <div></div>
          <div class="modal-ft-right">
            <button class="btn btn-ghost" id="ddlCancelBtn">Cancel</button>
            <button class="btn btn-primary" id="ddlGenerateBtn">Create</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Query History panel -->
    <div class="qhist-panel" id="qhistPanel" hidden>
      <div class="qhist-hd">
        <span class="qhist-title">Query History</span>
        <button class="icon-btn" id="qhistClear" title="Clear history">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
        <button class="icon-btn" id="qhistClose" title="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="qhist-list" id="qhistList"></div>
    </div>

    <script>
      // Unregister stale service workers so new JS/CSS always loads fresh
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => r.unregister());
        });
      }
    </script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
