<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2638"/>
      <stop offset="100%" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="cyl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3db8f0"/>
      <stop offset="100%" stop-color="#0072b8"/>
    </linearGradient>
    <linearGradient id="cyl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f4a72"/>
      <stop offset="100%" stop-color="#082e48"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltglow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Cylinder body -->
  <rect x="52" y="100" width="152" height="96" fill="url(#cyl-body)" rx="4"/>

  <!-- Cylinder mid stripe -->
  <rect x="52" y="148" width="152" height="2" fill="#1a6fa0" opacity="0.5"/>

  <!-- Cylinder bottom ellipse -->
  <ellipse cx="128" cy="196" rx="76" ry="22" fill="#082e48"/>
  <ellipse cx="128" cy="196" rx="76" ry="22" fill="none" stroke="#1a6fa0" stroke-width="1.5" opacity="0.6"/>

  <!-- Cylinder top ellipse (cap) -->
  <ellipse cx="128" cy="100" rx="76" ry="22" fill="url(#cyl-top)" filter="url(#glow)"/>

  <!-- Sheen on top cap -->
  <ellipse cx="108" cy="95" rx="28" ry="9" fill="white" opacity="0.12" transform="rotate(-10,108,95)"/>

  <!-- Second ring stripe (mid-body) -->
  <ellipse cx="128" cy="148" rx="76" ry="22" fill="none" stroke="#1e7ab5" stroke-width="1" opacity="0.45"/>

  <!-- Lightning bolt (centered, sharp) -->
  <path d="M148 46 L108 136 H134 L108 210 L172 114 H144 Z"
        fill="url(#bolt)"
        filter="url(#boltglow)"
        opacity="0.97"/>

  <!-- Bolt edge highlight -->
  <path d="M148 46 L108 136 H134 L108 210 L172 114 H144 Z"
        fill="none"
        stroke="rgba(255,240,120,0.35)"
        stroke-width="1.5"
        stroke-linejoin="round"/>
</svg>
